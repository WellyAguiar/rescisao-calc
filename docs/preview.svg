    <text x="44" y="131" class="mono" font-size="14" fill="#F8FAFC">R$ 6.500,00</text>

    <text x="28" y="174" class="sans" font-size="12" font-weight="600" fill="#C4B5FD">Admissão</text>
    <rect x="28" y="184" width="220" height="40" rx="8" fill="#0B0714" stroke="#4C1D95" />
    <text x="44" y="209" class="mono" font-size="13" fill="#E2E8F0">10/01/2023</text>

    <text x="272" y="174" class="sans" font-size="12" font-weight="600" fill="#C4B5FD">Desligamento</text>

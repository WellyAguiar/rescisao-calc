    <line x1="32" y1="104" x2="520" y2="104" stroke="#3B0764" />

    <text x="32" y="142" class="sans" font-size="13.5" fill="#CBD5E1">Saldo de Salário (18 dias)</text>
    <text x="520" y="142" text-anchor="end" class="mono" font-size="13.5" fill="#F8FAFC">R$ 3.900,00</text>

    <text x="32" y="186" class="sans" font-size="13.5" fill="#CBD5E1">Aviso Prévio Indenizado (Lei 12.506 • 39d)</text>
    <text x="520" y="186" text-anchor="end" class="mono" font-size="13.5" fill="#F8FAFC">R$ 8.450,00</text>


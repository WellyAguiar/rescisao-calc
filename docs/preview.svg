    <text x="520" y="274" text-anchor="end" class="mono" font-size="13.5" fill="#F8FAFC">R$ 6.581,25</text>

    <text x="32" y="318" class="sans" font-size="13.5" fill="#CBD5E1">Terço Constitucional de Férias (1/3)</text>
    <text x="520" y="318" text-anchor="end" class="mono" font-size="13.5" fill="#C084FC">R$ 2.193,75</text>

    <rect x="32" y="354" width="488" height="42" rx="8" fill="#150D2A" stroke="#4C1D95" />
    <text x="48" y="380" class="mono" font-size="11" fill="#34D399">✓ 8 módulos puros validados com cobertura unitária Vitest</text>
